<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HarborStay{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('results') }}" data-testid="brand">HarborStay</a>
    <p class="tagline">Find a room by the water — or on the map.</p>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Mock catalog only. No real payments or location tracking.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
